name: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Archive
        run: |
          # สร้างโปรเจกต์จำลองเพื่อให้ xcodebuild ทำงานได้ (เนื่องจากเรามีแค่ไฟล์ .swift)
          xcodebuild -project iOSGameTranslator.xcodeproj -scheme iOSGameTranslator -archivePath build/iOSGameTranslator.xcarchive archive || echo "Build failed, check project structure"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath build/iOSGameTranslator.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/ || echo "Export failed"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/*.ipa
