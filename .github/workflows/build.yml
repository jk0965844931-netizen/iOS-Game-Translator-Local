name: Build iOS IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Archive
        run: |
          xcodebuild \
            -project iOSGameTranslator.xcodeproj \
            -scheme iOSGameTranslator \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package IPA manually
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/iOSGameTranslator.app \
            build/Payload/
          cd build
          zip -r iOSGameTranslator.ipa Payload
          echo "IPA created!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/iOSGameTranslator.ipa
          if-no-files-found: error
