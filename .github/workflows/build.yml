name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Xcode
        uses: actions/setup-xcode@v1
      - name: Build Archive
        run: |
          xcodebuild -project iOSGameTranslator.xcodeproj -scheme iOSGameTranslator -archivePath build/iOSGameTranslator.xcarchive archive
      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath build/iOSGameTranslator.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: unsigned-ipa
          path: build/*.ipa
